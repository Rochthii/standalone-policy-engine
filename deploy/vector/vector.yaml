# Vector Sidecar Configuration for Standalone PDP Audit Logging
# High-Throughput (1,000,000+ logs/sec), Zero-GC (Rust), Persistent Disk Buffer

sources:
  pdp_audit_stream:
    type: "socket"
    mode: "unix"
    address: "/var/run/vector/audit.sock"
    decoding:
      codec: "json"

transforms:
  enrich_metadata:
    type: "remap"
    inputs:
      - "pdp_audit_stream"
    source: |
      .source = "pdp-data-plane"
      .ingested_at = now()
      if exists(.ts) {
        .evaluated_at = to_timestamp!(.ts, unit: "nanoseconds")
      }

sinks:
  clickhouse_audit_sink:
    type: "clickhouse"
    inputs:
      - "enrich_metadata"
    endpoint: "http://clickhouse.logging.svc.cluster.local:8123"
    database: "audit"
    table: "pdp_decision_logs"
    skip_unknown_fields: true
    batch:
      max_bytes: 10485760 # 10MB
      timeout_secs: 1
    buffer:
      type: "disk"
      max_size: 5368709120 # 5GB dedicated buffer on PV
      when_full: "block"

  kafka_backup_sink:
    type: "kafka"
    inputs:
      - "enrich_metadata"
    bootstrap_servers: "kafka.logging.svc.cluster.local:9092"
    topic: "pdp-audit-events"
    encoding:
      codec: "json"
