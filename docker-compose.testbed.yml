# ============================================================================
# STANDALONE POLICY ENGINE & ODOO 17 DEVELOPMENT TESTBED
# The Odoo E2E profile is self-contained and all external images are pinned by digest.
# Real Odoo transaction gate: make test-odoo-e2e
# ============================================================================

services:
  # 1. PostgreSQL 15 Database
  testbed-db:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    container_name: testbed_postgres
    restart: unless-stopped
    ports:
      - "${PDP_TESTBED_POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: pdp_admin
      POSTGRES_PASSWORD: pdp_secret_password_2026
      POSTGRES_DB: policy_engine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdp_admin -d policy_engine"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - testbed_pg_data:/var/lib/postgresql/data
      - ./deployments/docker/init-testbed-databases.sql:/docker-entrypoint-initdb.d/10-create-odoo.sql:ro

  # 2. Standalone Go PDP Server Data Plane
  testbed-pdp:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.pdp
    image: standalone-pdp:v1.0.0
    container_name: testbed_pdp_server
    restart: unless-stopped
    ports:
      - "${PDP_TESTBED_GRPC_PORT:-15051}:50051"
    environment:
      STORAGE_MODE: cloud
      DATABASE_URL: postgres://pdp_admin:pdp_secret_password_2026@testbed-db:5432/policy_engine?sslmode=disable
      JWT_SECRET: testbed-jwt-secret-at-least-32-characters
      JWT_ISSUER: standalone-policy-engine-testbed
      JWT_AUDIENCE: standalone-policy-engine-pdp
      PDP_DELEGATION_ACTIVE_KID: testbed-2026
      PDP_DELEGATION_KEYS_JSON: '{"testbed-2026":"testbed-delegation-secret-at-least-32-characters"}'
      LOG_KEK_ACTIVE_KID: testbed-audit-2026
      LOG_KEKS_JSON: '{"testbed-audit-2026":"testbed-audit-kek-2026-32-bytes!"}'
      AUDIT_SPILL_DIR: /var/lib/pdp/audit-spill
    volumes:
      - testbed_pdp_audit_spill:/var/lib/pdp/audit-spill
    depends_on:
      testbed-db:
        condition: service_healthy

  # Ephemeral certificate generator used only by `make test-odoo-e2e`.
  testbed-certgen:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.pdp
    image: standalone-pdp:v1.0.0
    restart: "no"
    entrypoint: ["/app/test-certgen"]
    command: ["-output", "/certs"]
    volumes:
      - testbed_tls:/certs

  # Production-mode PDP boundary with mandatory mutual TLS.
  testbed-pdp-mtls:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.pdp
    image: standalone-pdp:v1.0.0
    container_name: testbed_pdp_mtls_server
    restart: unless-stopped
    ports:
      - "${PDP_TESTBED_MTLS_GRPC_PORT:-15052}:50051"
    environment:
      APP_ENV: production
      STORAGE_MODE: cloud
      DATABASE_URL: postgres://pdp_admin:pdp_secret_password_2026@testbed-db:5432/policy_engine?sslmode=disable
      JWT_SECRET: testbed-jwt-secret-at-least-32-characters
      JWT_ISSUER: standalone-policy-engine-testbed
      JWT_AUDIENCE: standalone-policy-engine-testbed-pdp
      PDP_DELEGATION_ACTIVE_KID: testbed-2026
      PDP_DELEGATION_KEYS_JSON: '{"testbed-2026":"testbed-delegation-secret-at-least-32-characters"}'
      LOG_KEK_ACTIVE_KID: testbed-audit-2026
      LOG_KEKS_JSON: '{"testbed-audit-2026":"testbed-audit-kek-2026-32-bytes!"}'
      AUDIT_SPILL_DIR: /var/lib/pdp/audit-spill
      PDP_TLS_CERT: /run/pdp-tls/server.crt
      PDP_TLS_KEY: /run/pdp-tls/server.key
      PDP_TLS_CA: /run/pdp-tls/ca.crt
      GRPC_PORT: "50051"
    volumes:
      - testbed_tls:/run/pdp-tls:ro
      - testbed_pdp_mtls_audit_spill:/var/lib/pdp/audit-spill
    depends_on:
      testbed-db:
        condition: service_healthy

  # 3. Odoo 17.0 ERP Core
  testbed-odoo:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.odoo
    image: standalone-pdp-odoo:17.0-client-v1
    container_name: testbed_odoo_erp
    restart: unless-stopped
    ports:
      - "${PDP_TESTBED_ODOO_PORT:-18069}:8069"
    command: ["--database=odoo", "--db-filter=^odoo$"]
    environment:
      HOST: testbed-db
      USER: pdp_admin
      PASSWORD: pdp_secret_password_2026
      PDP_GRPC_TARGET: testbed-pdp:50051
      PDP_CLIENT_ENV: test
      PDP_TENANT_ID: 00000000-0000-0000-0000-000000000017
      PDP_JWT_SECRET: testbed-jwt-secret-at-least-32-characters
      PDP_JWT_ISSUER: standalone-policy-engine-testbed
      PDP_JWT_AUDIENCE: standalone-policy-engine-pdp
      PDP_DELEGATION_ACTIVE_KID: testbed-2026
      PDP_DELEGATION_KEYS_JSON: '{"testbed-2026":"testbed-delegation-secret-at-least-32-characters"}'
      PYTHONPATH: /opt/pdp-clients
    volumes:
      - ./custom_addons:/mnt/extra-addons:ro
      - ./clients/python:/opt/pdp-clients:ro
    depends_on:
      testbed-db:
        condition: service_healthy
      testbed-pdp:
        condition: service_started

  # 4. Real Odoo ORM -> gRPC -> Go PDP transaction gate
  testbed-odoo-e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.odoo
    image: standalone-pdp-odoo:17.0-client-v1
    container_name: testbed_odoo_e2e
    restart: "no"
    entrypoint: ["python3", "/opt/pdp-e2e/run-odoo-e2e.py"]
    environment:
      HOST: testbed-db
      USER: pdp_admin
      PASSWORD: pdp_secret_password_2026
      PDP_DB_HOST: testbed-db
      PDP_GRPC_TARGET: testbed-pdp-mtls:50051
      PDP_CLIENT_ENV: production
      PDP_TENANT_ID: 00000000-0000-0000-0000-000000000017
      PDP_JWT_SECRET: testbed-jwt-secret-at-least-32-characters
      PDP_JWT_ISSUER: standalone-policy-engine-testbed
      PDP_JWT_AUDIENCE: standalone-policy-engine-testbed-pdp
      PDP_DELEGATION_ACTIVE_KID: testbed-2026
      PDP_DELEGATION_KEYS_JSON: '{"testbed-2026":"testbed-delegation-secret-at-least-32-characters"}'
      PDP_CLIENT_TLS_CA: /run/pdp-tls/ca.crt
      PDP_CLIENT_TLS_CERT: /run/pdp-tls/client.crt
      PDP_CLIENT_TLS_KEY: /run/pdp-tls/client.key
      PDP_TLS_SERVER_NAME: testbed-pdp-mtls
      PDP_E2E_POLICY_SQL: /opt/pdp-e2e/policies.sql
      PDP_E2E_CONCURRENCY_RUNNER: /opt/pdp-e2e/run-odoo-concurrency.py
      PYTHONPATH: /opt/pdp-clients
    volumes:
      - ./custom_addons:/mnt/extra-addons:ro
      - ./clients/python:/opt/pdp-clients:ro
      - ./deployments/docker/run-odoo-e2e.py:/opt/pdp-e2e/run-odoo-e2e.py:ro
      - ./deployments/docker/run-odoo-concurrency.py:/opt/pdp-e2e/run-odoo-concurrency.py:ro
      - ./deployments/docker/odoo-e2e-policies.sql:/opt/pdp-e2e/policies.sql:ro
      - testbed_tls:/run/pdp-tls:ro
    depends_on:
      testbed-db:
        condition: service_healthy
      testbed-pdp-mtls:
        condition: service_started

  # 5. Automated in-process core vectors and benchmark runner
  testbed-runner:
    profiles: ["core-benchmark"]
    image: golang:1.25-alpine@sha256:1ae0735f00daffa3aaf1363a5184c0d2dc55c78e3db4ec70241cdac97bf84b59
    container_name: testbed_test_runner

    working_dir: /app
    volumes:
      - .:/app
    environment:
      PDP_GRPC_TARGET: testbed-pdp:50051
      PDP_SHARED_SECRET: pdp_master_secret_key_32bytes!
      CGO_ENABLED: "0"
    command: >
      sh -c "
        echo '=== RUNNING 7 TEST VECTORS INSIDE PINNED TESTBED ===' &&
        go test -v ./tests -run=TestE2E_P2P_Delegation_7Vectors &&
        echo '=== BENCHMARKING SUB-MICROSECOND HOT-PATH ===' &&
        go test -bench=BenchmarkEvaluatorLatency -benchmem ./tests -run=^$ &&
        echo '=== ALL TESTBED VERIFICATIONS PASSED 100% ==='
      "
    depends_on:
      testbed-pdp:
        condition: service_started

volumes:
  testbed_pg_data:
  testbed_tls:
  testbed_pdp_audit_spill:
  testbed_pdp_mtls_audit_spill:
