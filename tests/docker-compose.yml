services:
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: policy_engine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  vector:
    image: timberio/vector:0.35.0-alpine
    command: ["--config-yaml", "sources:\n  dummy:\n    type: internal_metrics\nsinks:\n  console:\n    type: console\n    inputs: [dummy]\n    encoding:\n      codec: json"]
    healthcheck:
      test: ["CMD", "vector", "validate", "--help"]
      interval: 2s
      timeout: 2s
      retries: 5

  pdp-server:
    image: standalone-pdp-test:latest
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.pdp
    ports:
      - "50061:50051"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/policy_engine?sslmode=disable
      JWT_SECRET: test-secret-key-for-sprint-6-unit-test
    depends_on:
      db:
        condition: service_healthy

  control-plane:
    image: standalone-control-test:latest
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.control
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/policy_engine?sslmode=disable
      JWT_SECRET: test-secret-key-for-sprint-6-unit-test
    depends_on:
      db:
        condition: service_healthy
