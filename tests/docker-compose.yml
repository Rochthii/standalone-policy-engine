services:
  db:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: policy_engine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  pdp-server:
    image: standalone-pdp-test:latest
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.pdp
    ports:
      - "50061:50051"
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/policy_engine?sslmode=disable
      JWT_SECRET: test-secret-key-for-sprint-6-unit-test
      JWT_ISSUER: standalone-policy-engine-test
      JWT_AUDIENCE: standalone-policy-engine-pdp-test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 10

  control-plane:
    image: standalone-control-test:latest
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.control
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/policy_engine?sslmode=disable
      JWT_SECRET: test-secret-key-for-sprint-6-unit-test
      JWT_ISSUER: standalone-policy-engine-test
      JWT_AUDIENCE: standalone-policy-engine-pdp-test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 10
